<!doctype html>
<html lang="is">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Tölfræði — Fjölskylduvikan</title>
  <link rel="icon" href="icons/icon-192.png?v=2">
  <style>
    :root {
      color-scheme: light;
      --bg: #ffffff; --surface: #fcfcfb; --card: #ffffff; --line: #e9e9e7; --fill: rgba(55,53,47,.06);
      --ink: #37352f; --ink-2: #52514e; --muted: #787774; --grid: #ececea;
      --accent: #2383e2; --good: #0f7b6c; --bad: #d44c47; --warn-bg: #fbf3db; --bad-bg: #fdebec;
      --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #6250d6; --s8: #e34948;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        color-scheme: dark;
        --bg: #191919; --surface: #1a1a19; --card: #202020; --line: #2f2f2f; --fill: rgba(255,255,255,.055);
        --ink: #e6e6e3; --ink-2: #c3c2b7; --muted: #9b9b9b; --grid: #2c2c2b;
        --accent: #529cca; --good: #4dab9a; --bad: #ff7369; --warn-bg: #3a3323; --bad-bg: #3b2222;
        --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
      }
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #191919; --surface: #1a1a19; --card: #202020; --line: #2f2f2f; --fill: rgba(255,255,255,.055);
      --ink: #e6e6e3; --ink-2: #c3c2b7; --muted: #9b9b9b; --grid: #2c2c2b;
      --accent: #529cca; --good: #4dab9a; --bad: #ff7369; --warn-bg: #3a3323; --bad-bg: #3b2222;
      --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
    main { max-width: 1040px; margin: 0 auto; padding: 28px 16px 64px; }
    h1 { font-size: 30px; line-height: 1.2; margin: 0; letter-spacing: -.01em; }
    h2 { font-size: 17px; margin: 0 0 12px; }
    .sub { color: var(--muted); margin: 4px 0 0; font-size: 14px; }
    .head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 22px; }
    .btn { font: inherit; font-size: 14px; border: 0; border-radius: 4px; padding: 8px 14px; background: var(--fill); color: var(--ink); cursor: pointer; }
    .btn.primary { background: var(--ink); color: var(--bg); }
    .link { background: none; border: 0; color: var(--muted); font: inherit; font-size: 13px; text-decoration: underline; cursor: pointer; padding: 4px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 4px; padding: 18px; margin-bottom: 16px; }
    .tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 16px; }
    .tile { background: var(--card); border: 1px solid var(--line); border-radius: 4px; padding: 14px 16px; }
    .tile .label { font-size: 13px; color: var(--muted); }
    .tile .value { font-size: 30px; font-weight: 650; line-height: 1.15; margin-top: 4px; font-variant-numeric: tabular-nums; }
    .tile .value small { font-size: 15px; font-weight: 500; color: var(--muted); }
    .tile .note { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
    @media (max-width: 760px) { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    .gate { max-width: 420px; margin: 12vh auto 0; }
    .gate input { width: 100%; font: inherit; font-size: 16px; padding: 10px 12px; border: 0; border-radius: 4px; background: var(--fill); color: var(--ink); margin: 12px 0; }
    .err { color: var(--bad); font-size: 14px; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
    th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
    th { font-weight: 600; color: var(--muted); font-size: 12.5px; }
    td.num, th.num { text-align: right; }
    .scroll { overflow-x: auto; margin: 0 -4px; padding: 0 4px; }
    .fam-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
    .swatch { width: 10px; height: 10px; border-radius: 2px; flex: none; }
    .pill { font-size: 12px; padding: 2px 8px; border-radius: 4px; background: var(--fill); color: var(--ink-2); }
    .pill.bad { background: var(--bad-bg); color: var(--bad); }
    .yes { color: var(--good); } .no { color: var(--muted); }
    .problem { background: var(--warn-bg); border-radius: 4px; padding: 10px 12px; font-size: 14px; }
    .subhead { font-size: 13px; color: var(--muted); font-weight: 600; margin: 14px 0 4px; }
    /* Graf */
    .chart-wrap { position: relative; }
    .legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--ink-2); margin: 0 0 8px; }
    .legend span { display: inline-flex; align-items: center; gap: 6px; }
    .legend i { width: 14px; height: 2px; border-radius: 1px; display: inline-block; }
    svg text { fill: var(--muted); font-size: 11px; }
    .tip { position: absolute; pointer-events: none; background: var(--card); border: 1px solid var(--line); border-radius: 4px; padding: 8px 10px; font-size: 13px; box-shadow: 0 4px 16px rgba(0,0,0,.08); min-width: 150px; display: none; z-index: 2; }
    .tip b { display: block; margin-bottom: 4px; }
    .tip div { display: flex; align-items: center; gap: 6px; justify-content: space-between; }
    .tip div span { display: inline-flex; align-items: center; gap: 6px; }
    .tip i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
    .foot { color: var(--muted); font-size: 13px; margin-top: 24px; }
  </style>
</head>
<body>
  <main id="app"><p class="sub">Hleð…</p></main>
  <script type="module" src="js/stats.js"></script>
</body>
</html>
